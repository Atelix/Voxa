name: Deploy beta
# Beta is deployed only on request, not on every merge, so busy days of merged pull requests do not each
# spend a full test, image and deploy run. Start it under Actions → Deploy beta → Run workflow; the branch
# chosen there is the one that is tested and deployed.
on:
  workflow_dispatch:
# A new run waits for the running one instead of cancelling it halfway, between the API update and the Worker deploy.
concurrency:
  group: deploy-beta
  cancel-in-progress: false
permissions:
  contents: read
env:
  REGISTRY: ghcr.io
jobs:
  integration:
    uses: ./.github/workflows/continuous-integration.yml
    # The publish job builds every image after the tests pass, so CI does not build them a second time.
    with:
      skip-docker-build: true
  metadata:
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
      short_commit: ${{ steps.revision.outputs.short_commit }}
      repository: ${{ steps.revision.outputs.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: revision
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "short_commit=${commit::12}" >> "$GITHUB_OUTPUT"
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
  publish:
    name: Publish ${{ matrix.image }} beta image
    needs: [integration, metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Only this job pushes images, so only it may write packages.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.integration.outputs.docker) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.metadata.outputs.repository }}/${{ matrix.image }}:beta
            ${{ env.REGISTRY }}/${{ needs.metadata.outputs.repository }}/${{ matrix.image }}:sha-${{ needs.metadata.outputs.commit }}
          labels: |
            org.opencontainers.image.revision=${{ needs.metadata.outputs.commit }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=beta-${{ needs.metadata.outputs.short_commit }}
          # The API and PWA must share the version: the PWA shows a maintenance screen while they differ.
          build-args: |
            APP_VERSION=beta-${{ needs.metadata.outputs.short_commit }}
            VITE_APP_VERSION=beta-${{ needs.metadata.outputs.short_commit }}
  api:
    name: Update beta API server
    needs: [metadata, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Secrets stored on the beta environment are only given to its jobs; until then the repository secrets are used.
    # Beta is deployed from any branch on purpose, so the environment must not restrict branches.
    environment: beta
    env:
      API_URL: ${{ vars.BETA_API_URL }}
      EXPECTED_VERSION: beta-${{ needs.metadata.outputs.short_commit }}
      WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_BETA_TOKEN }}
    steps:
      - name: Require Watchtower settings
        shell: bash
        run: |
          if [[ -z "$API_URL" || -z "$WATCHTOWER_TOKEN" ]]; then
            echo "The BETA_API_URL variable and WATCHTOWER_BETA_TOKEN secret must be configured (on the beta environment or the repository)." >&2
            exit 1
          fi

      # Watchtower pulls the new image and recreates the container before it responds. An update is idempotent, so a
      # dropped connection or a 429 from the rate limit in front of it is retried.
      - name: Trigger Watchtower update
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --max-time 600 \
            --retry 2 --retry-all-errors --retry-delay 30 \
            --request POST \
            --header "Authorization: Bearer $WATCHTOWER_TOKEN" \
            "$API_URL/api/watchtower/v1/update"

      # The PWA is deployed only once the API runs the same version, so users see no maintenance screen.
      # The API applies its migrations when it starts, so allow it up to five minutes.
      - name: Wait for API to run the new version
        shell: bash
        run: |
          version=""
          for attempt in {1..60}; do
            version="$(curl --fail --silent --show-error --max-time 10 "$API_URL/api/health" | jq -r '.version // empty' || true)"
            if [[ "$version" == "$EXPECTED_VERSION" ]]; then
              echo "API runs version $version"
              exit 0
            fi
            echo "API reports version '${version:-unavailable}', expected '$EXPECTED_VERSION' (attempt $attempt), retrying in 5 seconds"
            sleep 5
          done
          echo "API did not report version $EXPECTED_VERSION after the update." >&2
          exit 1
  # The Worker is deployed after the API so the new frontend never talks to an old API.
  cloudflare:
    name: Deploy ${{ matrix.worker }} Cloudflare Worker
    needs: [metadata, publish, api]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: beta
    # Every front end runs on its own Worker; add a row per Worker.
    strategy:
      fail-fast: false
      matrix:
        include:
          - location: Voxa.PWA
            worker: voxa-pwa-beta
    # The Cloudflare credentials go only to the steps that need them, never to the install and build steps.
    env:
      # No VITE_API_URL: like production, the app calls /api on its own host, which the reverse proxy sends to the API.
      VITE_APP_VERSION: beta-${{ needs.metadata.outputs.short_commit }}
    steps:
      - name: Require Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN must be configured as secrets of the beta environment or the repository." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ matrix.location }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ${{ matrix.location }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ matrix.location }}
        run: pnpm install --frozen-lockfile

      # VITE_* values are baked in at build time, so the build must run with the beta environment.
      - name: Build Worker with beta settings
        working-directory: ${{ matrix.location }}
        run: pnpm run build

      - name: Deploy beta Cloudflare Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.location }}
          command: deploy --name ${{ matrix.worker }}

      # The Worker answers every path except /api on the app's host. A failed check leaves the deploy red, so a broken
      # release is noticed right away instead of by the first voter (docs/deployment.md, "Rolling back").
      - name: Check the deployed app
        shell: bash
        env:
          APP_URL: ${{ vars.BETA_API_URL }}
          EXPECTED_VERSION: beta-${{ needs.metadata.outputs.short_commit }}
        run: |
          for attempt in {1..12}; do
            page="$(curl --fail --silent --show-error --max-time 10 --write-out '%{http_code} %{content_type}' --output /dev/null "$APP_URL/" || true)"
            version="$(curl --fail --silent --show-error --max-time 10 "$APP_URL/api/health" | jq -r '.version // empty' || true)"
            if [[ "$page" == "200 text/html"* && "$version" == "$EXPECTED_VERSION" ]]; then
              echo "The app loads and the API runs version $version"
              exit 0
            fi
            echo "App page: '${page:-unavailable}', API version: '${version:-unavailable}' (attempt $attempt), retrying in 10 seconds"
            sleep 10
          done
          echo "The app at $APP_URL did not load, or its API does not run version $EXPECTED_VERSION." >&2
          exit 1

      - name: Add deployment summary
        run: |
          {
            echo "## Beta deployed"
            echo "- Commit: \`${{ needs.metadata.outputs.commit }}\`"
            echo "- Docker tag: \`beta\` (\`sha-${{ needs.metadata.outputs.commit }}\`)"
            echo "- Worker: \`${{ matrix.worker }}\`"
            echo "- API: ${{ vars.BETA_API_URL }} (updated through Watchtower)"
          } >> "$GITHUB_STEP_SUMMARY"
